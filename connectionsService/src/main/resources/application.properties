# Load secrets from .env: first entry = running from the service directory,
# second entry = running from the repo root (e.g. IntelliJ default working dir)
spring.config.import=optional:file:.env[.properties],optional:file:connectionsService/.env[.properties]

spring.application.name=connections-Service

server.port = 9030
server.servlet.context-path = /connections

spring.neo4j.uri=neo4j+s://cea21eed.databases.neo4j.io
spring.neo4j.authentication.username=cea21eed
spring.neo4j.authentication.password=C-w7vWkT5HePw4DXxjMDX6gPRe2pgMzIFGRk302gRYE
spring.neo4j.database=cea21eed

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Kafka (Aiven, SASL) - values come from .env
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH:./kafka-truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD:changeit}
spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=connections-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

kafka.topic.user=${KAFKA_TOPIC_USER:user_topic}
kafka.topic.connection=${KAFKA_TOPIC_CONNECTION:connection_topic}
