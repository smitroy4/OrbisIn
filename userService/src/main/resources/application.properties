# Load secrets from .env: first entry = running from the service directory,
# second entry = running from the repo root (e.g. IntelliJ default working dir)
spring.config.import=optional:file:.env[.properties],optional:file:userService/.env[.properties]

spring.application.name=user-Service
server.servlet.context-path=/users
server.port=9020

#DB configuration (Neon cloud postgres - values come from .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secretKey = asdfuasjf9a8s7fd89ihq34kljruyf98ayshcskdhfioafsuyfdcjha890sduf

eureka.client.service-url.defaultZone= http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Kafka (Aiven, SASL) - values come from .env
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH:./kafka-truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD:changeit}
spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

kafka.topic.user=${KAFKA_TOPIC_USER:user_topic}