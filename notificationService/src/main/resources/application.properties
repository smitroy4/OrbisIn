# Load secrets from .env: first entry = running from the service directory,
# second entry = running from the repo root (e.g. IntelliJ default working dir)
spring.config.import=optional:file:.env[.properties],optional:file:notificationService/.env[.properties]

spring.application.name=notificationService
server.port=9040

# MongoDB - values come from .env (Boot 4 binds the spring.mongodb.* prefix)
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:orbisin_notifications}
spring.data.mongodb.auto-index-creation=true

# Kafka (Aiven, SASL) - values come from .env
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
spring.kafka.properties.ssl.truststore.location=${KAFKA_TRUSTSTORE_PATH:./kafka-truststore.jks}
spring.kafka.properties.ssl.truststore.password=${KAFKA_TRUSTSTORE_PASSWORD:changeit}
spring.kafka.properties.ssl.truststore.type=JKS
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

kafka.topic.user=${KAFKA_TOPIC_USER:user_topic}
kafka.topic.post=${KAFKA_TOPIC_POST:post_topic}
kafka.topic.connection=${KAFKA_TOPIC_CONNECTION:connection_topic}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
