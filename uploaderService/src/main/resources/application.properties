# Load secrets from .env: first entry = running from the service directory,
# second entry = running from the repo root (e.g. IntelliJ default working dir)
spring.config.import=optional:file:.env[.properties],optional:file:uploaderService/.env[.properties]

spring.application.name=uploaderService
server.port=9060
server.servlet.context-path=/uploads

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Multipart limits (10 MB per file, 20 MB per request by default)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# --- Neon S3-compatible object storage (values come from .env, defaults for local dev) ---
# Never commit real credentials: put them in uploaderService/.env (git-ignored template below).
# endpoint is optional: empty means "use the SDK default for the region" (real AWS).
app.storage.endpoint=${AWS_ENDPOINT_URL_S3:}
app.storage.region=${AWS_REGION:ap-southeast-1}
app.storage.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.secret-key=${AWS_SECRET_ACCESS_KEY:}
app.storage.bucket=${STORAGE_BUCKET:orbisin-uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
# Presigned URL expiry for direct browser uploads / private reads
app.storage.presign-expiry-minutes=${STORAGE_PRESIGN_EXPIRY_MINUTES:15}
# Comma-separated allowlist; empty = allow all content types
app.storage.allowed-content-types=${STORAGE_ALLOWED_CONTENT_TYPES:}
app.storage.max-file-bytes=${STORAGE_MAX_FILE_BYTES:10485760}
